name: Verificar HCOP JP

on:
  push:
    branches: ["main", "master", "codex/**", "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    name: Compilacion y pruebas Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify

  docker:
    name: Producto Docker integral
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Construir e iniciar
        run: docker compose up --build --wait
      - name: Verificar salud
        run: curl --fail --silent --show-error http://127.0.0.1:5180/actuator/health
      - name: Recorrer el flujo clínico integral
        shell: pwsh
        run: ./scripts/integration-test.ps1
      - name: Diagnostico ante fallos
        if: failure()
        run: docker compose logs --no-color
      - name: Detener
        if: always()
        run: docker compose down --volumes
